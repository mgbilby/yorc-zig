# CI for the public repository mgbilby/yorc-zig. GitHub runs workflows only
# from .github/workflows/ at a repository's root, so this file is inert where
# yorc-zig/ is a subdirectory; it takes effect once the export places it at the
# root of the public repository.
#
# The Zig version is the exact development snapshot of minimum_zig_version in
# build.zig.zon; keep the two in step. setup-zig downloads it from the
# community mirrors and ziglang.org; if an old snapshot is no longer served,
# move to a newer one (or the next stable release) in both places.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.18.0-dev.131+41f885830

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # The tests need no network: the client tests use a mock server on 127.0.0.1.
      - run: zig build test --summary all
      - run: zig build test -Doptimize=ReleaseSafe --summary all
        if: runner.os == 'Linux'
      - run: zig build walkthrough
        if: runner.os == 'Linux'

  fmt:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check build.zig build.zig.zon src tests examples testdata/fixtures.zig
